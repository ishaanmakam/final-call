name: Pages (web simulator)

# Builds web/ (which imports packages/rules/src directly) and publishes dist/ to GitHub Pages at
# https://ishaanmakam.github.io/final-call/. One-time setup in the repo: Settings → Pages → Source
# "GitHub Actions". Runs only when the simulator or the rules oracle change on main.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'packages/rules/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build web/dist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/rules/package-lock.json
            web/package-lock.json
      - run: npm ci
        working-directory: packages/rules
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: npx vitest run
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_BASE: /final-call/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
