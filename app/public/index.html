<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!--
      Web template for `expo export --platform web` (Expo CLI reads public/index.html when present and
      appends the favicon link and the bundle scripts). Everything above the custom block is the stock
      Expo template; the custom block is the web-only layout: the phone-shaped app sits in a centered
      column on wide screens instead of stretching a list card to 1280 px. The page ground outside the
      column is the app's own background (src/theme/tokens.ts: light #F5F6F8, dark #0C1017), so the
      column has no visible edge; the stack header and content share the column.
    -->
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style id="final-call-web">
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        background: #f5f6f8;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0c1017;
        }
      }
      /* phone width on a desktop: one readable column (~600 px), centered; narrow screens are untouched */
      @media (min-width: 720px) {
        #root {
          max-width: 600px;
          margin: 0 auto;
        }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
