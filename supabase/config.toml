# Supabase CLI configuration for `supabase start`, `supabase link`, `supabase db push`,
# `supabase db reset` (migrations + seed) and `supabase functions deploy`.
#
# Rules for this file:
#   * Only documented keys appear. Every key below exists in the `supabase init` template of
#     CLI 3.0.0 (2026-11) or in the functions config reference; a misspelt key is silently ignored
#     by the CLI, so check against that template before adding one.
#   * No secrets. The Apple provider secret comes from an environment variable (`env(...)`); the
#     push-outbox Vault secrets are created per environment by hand (docs/DEPLOY.md).
#   * Most of this file only shapes the LOCAL stack. What reaches the hosted project is:
#     `db push` (migrations), `functions deploy` (functions, honouring [functions.*].verify_jwt)
#     and `supabase config push` (auth/storage/api sections, if you choose to run it).
#     Dashboard settings are listed step by step in docs/DEPLOY.md.

# Distinguishes local stacks on one machine (Docker container names). Not the hosted project ref:
# that comes from `supabase link --project-ref <ref>` and is stored in supabase/.temp (gitignored).
project_id = "final-call"

[api]
enabled = true
port = 54321
# Only `public` is exposed. The app never queries another schema; `graphql_public` is left out on
# purpose (nothing uses GraphQL and it would be one more surface to lint).
schemas = ["public"]
# `extensions` is on the search_path so `extensions.crypt(...)` etc. resolve for seed.sql locally.
extra_search_path = ["public", "extensions"]
# PostgREST hard cap per request. Screens page below this; the feed reads 28 days at most.
max_rows = 1000

[db]
port = 54322
# Used by `supabase db diff` to build a shadow database.
shadow_port = 54320
# Must equal the hosted project's major version (`show server_version;` on the remote). The
# migrations use PG17 features (e.g. `MERGE ... RETURNING` is not used, but tests run on PGlite 17).
major_version = 17

[db.migrations]
enabled = true
# No declarative schema files: supabase/migrations/*.sql is the whole source of truth.
schema_paths = []

[db.seed]
# `supabase db reset` and the first `supabase start` run seed.sql after the migrations. It creates
# two LOCAL-ONLY auth users (password `password123`), a group, a pact with two places and the next
# week of instances. It is never applied by `db push`; never run it against a hosted project.
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

# Local mail catcher (Mailpit). Magic links sent by the local stack land here, not in a real inbox:
# open http://127.0.0.1:54324 to click them.
[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
# `site_url` is the default redirect when a link carries no `redirect_to`. The app always passes
# `emailRedirectTo` (app/src/lib/auth.tsx), so this only has to be an allowed app URL.
# The app's scheme is `finalcall://` (app/app.config.ts). Same list in Dashboard → Authentication →
# URL Configuration for the hosted project.
site_url = "finalcall://auth-callback"
additional_redirect_urls = [
  "finalcall://auth-callback",
  "finalcall://auth-callback/**",
  # Expo Go / dev-client deep links while developing (exp://<lan-ip>:8081/--/auth-callback).
  "exp://**/--/auth-callback",
  # The web app (GitHub Pages, docs/DEPLOY.md "Web app") and `npx expo start --web` locally.
  "https://ishaanmakam.github.io/final-call/app/auth-callback",
  "http://localhost:8081/auth-callback",
]
# Access token lifetime (seconds). One hour; the client refreshes silently.
jwt_expiry = 3600
# A used refresh token is invalid after `refresh_token_reuse_interval` seconds (replay protection).
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Magic-link sign-in creates the account on first use (`shouldCreateUser: true` in the app).
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
# Passwords are not used by the app (magic link + Apple only); these only matter for the seed users.
minimum_password_length = 8
password_requirements = ""

[auth.rate_limit]
# Emails per hour from the built-in sender. The hosted default sender allows ~2/hour; configure a
# custom SMTP provider in the dashboard before TestFlight (docs/DEPLOY.md).
email_sent = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
# Magic links are the sign-in method, so the email provider must stay on (sign-up itself is
# governed by [auth].enable_signup above).
enabled = true
# Changing the account email requires confirming on both addresses.
double_confirm_changes = true
# A magic link IS the confirmation; no separate "confirm your email" step.
enable_confirmations = false
secure_password_change = false
# Minimum gap between two emails to one address; the sign-in screen disables its button for 60 s.
max_frequency = "60s"
# The link carries a PKCE code (not a 6-digit code), so otp_length only affects the fallback OTP
# the template may render ({{ .Token }}). One hour matches lib/pendingNext.ts's TTL (U6-12).
otp_length = 6
otp_expiry = 3600

# Native Sign in with Apple: the app sends Apple's identity token to signInWithIdToken, so the
# client id is the iOS BUNDLE ID (not a Services ID). Several ids may be comma-separated (add an
# IOS_BUNDLE_ID override here if you build under another id).
# `secret` is only needed for the web/OAuth flow (a JWT signed with the .p8 key); for native-only
# sign-in leave SUPABASE_AUTH_EXTERNAL_APPLE_SECRET unset. The CLI resolves a missing env var to "".
[auth.external.apple]
enabled = true
client_id = "com.ishaanmakam.finalcall"
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
# Native sign-in does not round-trip through Supabase's callback, so no redirect_uri override.
redirect_uri = ""
url = ""
skip_nonce_check = false
email_optional = false

[storage]
enabled = true
# Global cap for the local stack; the bucket below has its own (identical) cap.
file_size_limit = "5MiB"

# Appeal photos. Object path: <group_id>/<user_id>/<file>. The bucket row and its RLS policies are
# also created by 20261107000500_app_support.sql / 20261107000600_review_fixes.sql wherever
# `storage.buckets` exists (hosted project, local stack), so `db push` creates it on the hosted
# project too; this section makes `supabase start` match before the migrations run.
[storage.buckets.review-photos]
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/heic", "image/heif", "image/webp"]

[edge_runtime]
enabled = true
# `per_worker` hot-reloads functions during `supabase functions serve`.
policy = "per_worker"
inspector_port = 8083
deno_version = 2

# push-outbox checks `Authorization: Bearer <SUPABASE_SERVICE_ROLE_KEY>` itself (constant-time
# compare in outbox.ts) and answers 401 otherwise, so gateway JWT verification is off. pg_cron sends
# that exact key, read from Vault (`service_role_key`), see 20261107000400_cron.sql. `functions
# deploy` reads verify_jwt from here, so `--no-verify-jwt` on the command line is belt and braces.
[functions.push-outbox]
enabled = true
verify_jwt = false
entrypoint = "./functions/push-outbox/index.ts"

# strava-sync is reached by browsers (/connect, /callback, authenticated by a signed state) and by
# Strava's servers (/webhook, public per Strava), none of which carry a Supabase JWT; POST /state
# verifies the user's JWT itself with auth.getUser. Secrets: STRAVA_CLIENT_ID, STRAVA_CLIENT_SECRET,
# STRAVA_VERIFY_TOKEN, STRAVA_STATE_SECRET (docs/DEPLOY.md "Strava").
[functions.strava-sync]
enabled = true
verify_jwt = false
entrypoint = "./functions/strava-sync/index.ts"

[analytics]
# Local log explorer. Off: it is the heaviest container and nothing here reads it.
enabled = false

# Local stack notes (not config keys):
#   * pg_cron, pg_net and Vault ship with the local image, so the cron migration schedules the jobs
#     on `supabase start`. Vault secrets must be created once per environment before push-outbox
#     runs (the job raises until then, visible in cron.job_run_details):
#       select vault.create_secret('http://host.docker.internal:54321', 'project_url');  -- local
#       select vault.create_secret('<service role key>', 'service_role_key');
#   * `supabase functions serve push-outbox --no-verify-jwt` for local runs.
#   * `supabase test db` runs the pgTAP files in supabase/tests/pgtap/ (copy them to
#     supabase/tests/database/ if your CLI only looks there).
#   * Seed users exist only locally: alice@example.com / bob@example.com, password `password123`.
